<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0004"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#ff2a44" stroke-width="2"/>
  
  <!-- Outer gear / dial marks -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4, 4"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ff2a44" stroke-width="1" opacity="0.6"/>

  <!-- Containment / Clock motif (L-Corp / Dante / SCP) -->
  <path d="M 50 14 L 50 24 M 50 76 L 50 86 M 14 50 L 24 50 M 76 50 L 86 50" stroke="#ffaa00" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Inward Tri-arrows (SCP motif) -->
  <polygon points="50,28 46,36 54,36" fill="#ff2a44" filter="url(#glow)"/>
  <polygon points="50,72 46,64 54,64" fill="#ff2a44" filter="url(#glow)"/>
  <polygon points="28,50 36,46 36,54" fill="#ff2a44" filter="url(#glow)"/>
  <polygon points="72,50 64,46 64,54" fill="#ff2a44" filter="url(#glow)"/>

  <!-- Central eye / golden bough core -->
  <circle cx="50" cy="50" r="10" fill="#d4af37" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="4" fill="#ff2a44"/>
</svg>